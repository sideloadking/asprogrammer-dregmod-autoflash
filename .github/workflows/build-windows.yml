name: Build Windows

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Lazarus 32-bit (FPC 3.2.2)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://downloads.sourceforge.net/project/lazarus/Lazarus%20Windows%2032%20bits/Lazarus%202.2.6/lazarus-2.2.6-fpc-3.2.2-win32.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'lazarus-installer.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer -UserAgent 'github-actions'
          Start-Process -Wait -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/DIR="C:\lazarus"'
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\lazarus'
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\lazarus\fpc\3.2.2\bin\i386-win32'

      - name: Extract mphexeditor
        shell: pwsh
        run: Expand-Archive -Path mphexeditor.zip -DestinationPath . -Force

      - name: Copy chiplist.xml into software
        shell: pwsh
        run: Copy-Item -Path chiplist.xml -Destination software\chiplist.xml -Force

      - name: Register mphexeditor package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          lazbuild --add-package-link mphexeditor\src\mphexeditorlaz.lpk

      - name: Build AsProgrammer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          lazbuild -B software\AsProgrammer.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package runnable folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item software\AsProgrammer.exe dist\
          Copy-Item software\buzzpirathlp.dll dist\
          Copy-Item software\libiconv2.dll dist\
          Copy-Item software\libintl3.dll dist\
          Copy-Item software\FTD2XX.dll dist\
          Copy-Item software\CH341DLL.DLL dist\
          Copy-Item software\CH347DLL.DLL dist\
          Copy-Item software\chiplist.xml dist\
          Copy-Item drivers\AVRISPMK2\x86\libusb0_x86.dll dist\libusb0.dll
          Copy-Item drivers\FT232\CDM212364_Setup.exe dist\
          Copy-Item software\lang dist\lang -Recurse
          Copy-Item software\icons dist\icons -Recurse

      - name: Upload AsProgrammer (exe + dependencies)
        uses: actions/upload-artifact@v4
        with:
          name: AsProgrammer-win32
          path: dist\

      - name: Create release zip
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request'
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath AsProgrammer-win32.zip -Force

      - name: Attach zip to version release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AsProgrammer-win32.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach zip to new PR release
        if: github.event_name == 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pr-${{ github.event.pull_request.number }}-${{ github.run_number }}-${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          name: "PR #${{ github.event.pull_request.number }} build (${{ github.run_number }})"
          prerelease: true
          generate_release_notes: false
          files: AsProgrammer-win32.zip
          body: |
            Automated Windows build for PR #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}
            Commit: `${{ github.sha }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
